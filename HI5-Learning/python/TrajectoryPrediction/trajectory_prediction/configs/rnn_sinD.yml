# General Description
description: Pedestrian Motion Prediction

# Model
model: {
  class: TrajNet,
  module: models.model,
  # Network configuration
  num_inputs: 7,
  num_outputs: 2,
  num_hidden: 128,
  num_layers: 1,
  interaction_aware: true,
  use_ode: false,
  use_map: false,
  step_size: 0.2,
  num_modes: 1,
  pred_hrz: 25,
}

# Lightning module
litmodule: {
  class: LitModel,
  module: models.litmodule
}

# Datamodule
datamodule: {
  class: DroneDataModule,
  module: datamodules.dataloader,
  batch_size: 256,
  transform: ["CoordinateTransform"],
  root: datasets/,
  name: sinD
}

# Trainer
training: {
  epochs: 1000,
  lr: 0.0001,
  clip: 1.0,
  radius: 50,
  standardize: false
}